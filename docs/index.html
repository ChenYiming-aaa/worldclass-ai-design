<style>
/* ============================================================
   纸带流水 — 单文件记账工具
   左边「记与查」，右边「看与打」。
   账单从出纸口里逐行吐出来。
   只用两个颜色：墨黑 + 热敏红。纸是纸，机器是机器。
   ============================================================ */

:root {
  /* 桌面与机器 */
  --desk: #201d18;
  --panel: #26221c;
  --panel-2: #1c1914;
  --edge: #3d372d;
  --edge-2: #4a4336;
  --txt: #e8e2d5;      /* 12.6:1 on panel */
  --txt-2: #a39a89;    /* 5.9:1 on panel */
  --hair: #33302a;
  --red-d: #e0604a;    /* 4.7:1 on panel */
  --ok-d: #93b48f;

  /* 纸 */
  --paper: #f4f1e8;
  --ink: #1f1c17;      /* 15.0:1 */
  --ink-2: #4f4a40;    /* 7.8:1 */
  --ink-3: #6e6759;    /* 5.0:1 */
  --rule: #c6beac;
  --red: #b03a20;      /* 5.4:1 */

  --teeth: 9px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --face: var(--mono), var(--cjk);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 24px 18px 64px;
  background: var(--desk);
  font-family: var(--face);
  color: var(--txt);
  font-size: 14px;
}

/* ============================================================
   总体两栏：左边「记与查」，右边「看与打」。
   频率分层：L0 录入 / L1 概览 / L2 流水 / L3 打印 / L5 设置
   ============================================================ */

.app {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 22px 26px;
  align-items: start;
  max-width: 1160px;
  margin: 0 auto;
}

/* ---------- 顶栏 ---------- */

.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 0 2px 2px;
}
.topbar__brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: .18em;
}
.tagline { margin: 0; font-size: 11.5px; letter-spacing: .04em; color: var(--txt-2); }
.topbar__meta { margin: 0; font-size: 11.5px; color: var(--txt-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 主列 / 右列 ---------- */

.main { display: grid; gap: 28px; min-width: 0; }

.side {
  position: sticky;
  top: 24px;
  align-self: start;
  display: grid;
  gap: 20px;
  min-width: 0;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--edge-2) transparent;
  padding-right: 2px;
}

/* ---------- 卡片 ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  padding: 16px 18px 18px;
  color-scheme: dark;
}
.card--entry.is-editing {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 3px 0 0 var(--red-d);
}

.cap {
  margin: 0 0 10px;
  font-size: 10.5px;
  letter-spacing: .2em;
  color: var(--txt-2);
}
.cap b { color: var(--txt); font-weight: 600; }
.cap .n { color: var(--txt-2); }

/* ---------- 表单 ---------- */

.seg { display: flex; gap: 0; margin-bottom: 12px; }
.seg button {
  flex: 1;
  font: inherit; font-size: 13px; letter-spacing: .08em;
  padding: 7px 0; cursor: pointer;
  background: transparent; color: var(--txt-2);
  border: 1px solid var(--edge);
}
.seg button + button { border-left: 0; }
.seg button.on { background: var(--txt); color: #1c1914; border-color: var(--txt); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--red-d); outline-offset: 2px; }

.fld { margin-bottom: 10px; }
.fld > span {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-bottom: 4px;
  font-size: 11px; letter-spacing: .1em; color: var(--txt-2);
}

input, select, textarea {
  width: 100%;
  font: inherit; font-size: 13.5px;
  padding: 7px 9px;
  color: var(--txt);
  background: var(--panel-2);
  border: 1px solid var(--edge);
}
input:focus, select:focus { outline: none; border-color: var(--txt-2); }
input.bad, select.bad { border-color: var(--red-d); }
input::placeholder { color: #6d6557; }

.hint { margin: 0; font-size: 10.5px; color: #8d8474; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.err { margin: 4px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--red-d); min-height: 0; }
.err:empty { display: none; }

.btn {
  font: inherit; font-size: 13px; letter-spacing: .06em;
  padding: 8px 14px; cursor: pointer;
  background: transparent; color: var(--txt-2);
  border: 1px solid var(--edge-2);
}
.btn:hover { color: var(--txt); border-color: var(--txt-2); }
.btn:focus-visible { outline: 2px solid var(--red-d); outline-offset: 2px; }
.btn--primary { background: var(--paper); color: #1c1914; border-color: var(--paper); font-weight: 600; }
.btn--primary:hover { background: #fff; color: #1c1914; }
.btn--primary.is-done { background: var(--ok-d); border-color: var(--ok-d); color: #1c1914; }
.btn--danger { color: var(--red-d); border-color: #5a372f; }
.btn--danger:hover { color: #f0a293; border-color: var(--red-d); }
.btn--danger.is-arm { background: var(--red-d); color: #1c1914; border-color: var(--red-d); font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.frow { display: flex; gap: 8px; margin-top: 4px; }
.frow .btn { flex: 1; }
.frow .btn--primary { flex: 2; }

/* 表单字段两两一行，把五行的录入压成两行 */
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

/* ---------- 概览：三列小字 + 点阵 ---------- */

.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 4px; }
.tri > div { min-width: 0; }
.tri dt { font-size: 11px; letter-spacing: .04em; color: var(--txt-2); }
.tri dd { margin: 2px 0 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tri dd.is-red { color: var(--red-d); }
.tri dd.is-ok { color: var(--ok-d); }

.net { margin: 4px 0 12px; }
.net__label { display: block; margin-bottom: 2px; font-size: 11px; letter-spacing: .1em; color: var(--txt-2); }
.net__v { font-size: 26px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.net__v.is-neg { color: var(--red-d); }

.cap--sub { margin-top: 14px; }
.stat__rule { height: 0; border-top: 1px dashed var(--edge); margin: 14px 0 12px; }
.stat__scope { margin: 12px 0 0; font-size: 10.5px; line-height: 1.6; color: #8d8474; }

/* 面板上的分类占比：纸面那套墨色在暗面板上看不清，换成面板色 */
.bars--panel { font-size: 12px; }
.bars--panel .bars__row { padding: 2px 0; }
.bars--panel .bars__cat { color: var(--txt-2); }
.bars--panel .bars__amt { color: var(--txt); }
.bars--panel .bars__pct { color: var(--txt-2); }
.bars--panel .dots i { height: 7px; background: var(--hair); }
.bars--panel .dots i.on { background: var(--txt); }

/* 预算条：点阵，不是进度条 */
.bbar { display: flex; gap: 2px; margin: 8px 0 4px; }
.bbar i { flex: 1 1 0; height: 8px; background: var(--hair); }
.bbar i.on { background: var(--txt-2); }
.bbar i.hot { background: var(--red-d); }
.bnote { margin: 0; font-size: 11.5px; color: var(--txt-2); }
.bnote.is-red { color: var(--red-d); }

/* 预算行内设置：看和设在同一行 */
.brow { display: flex; align-items: center; gap: 8px; }
.brow__lab { margin-right: auto; font-size: 11px; letter-spacing: .1em; color: var(--txt-2); }
.brow input[type="number"] { width: 96px; }
.brow .sw { flex: 0 0 40px; }
.btn--lite { font-size: 11.5px; padding: 5px 10px; border-style: dashed; letter-spacing: .06em; }
#b-view { margin-top: 10px; }

/* ---------- 流水列表 ---------- */

/* 流水随页面统一滚动，不再套内部滚动条；按日分组，组头带小计 */
.rows { list-style: none; margin: 0; padding: 0; }
.dhead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 12px 0 5px;
  border-bottom: 1px solid var(--hair);
  font-size: 11.5px; color: var(--txt-2);
}
.rows > .dhead:first-child { padding-top: 2px; }
.dhead b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
.dhead span { font-variant-numeric: tabular-nums; }
.row {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto auto;
  gap: 0 8px; align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px dotted var(--hair);
  font-size: 13px;
}
.row__c { color: var(--txt-2); font-size: 11.5px; }
.row__n { min-width: 0; overflow-wrap: anywhere; }
.row__a { font-variant-numeric: tabular-nums; text-align: right; }
.row__a.in { font-weight: 600; }
.row__ops { display: flex; gap: 4px; }
.row__ops button {
  font: inherit; font-size: 10.5px; padding: 1px 6px; cursor: pointer;
  background: transparent; color: #8d8474; border: 1px solid var(--edge);
}
.row__ops button:hover { color: var(--txt); border-color: var(--txt-2); }
.row__ops button.is-arm { background: var(--red-d); color: #1c1914; border-color: var(--red-d); font-weight: 600; }
.row__ops button:focus-visible { outline: 2px solid var(--red-d); outline-offset: 1px; }
.row.is-edit { background: #2f2a22; }
.row-empty { padding: 20px 0; font-size: 12.5px; line-height: 1.8; color: var(--txt-2); text-align: center; }

/* ---------- 设置 ---------- */

.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.opt > span { font-size: 12.5px; color: var(--txt-2); }
.opt input[type="number"] { width: 108px; }
.sw {
  position: relative; width: 40px; height: 20px; flex: 0 0 40px;
  background: var(--panel-2); border: 1px solid var(--edge-2); cursor: pointer;
}
.sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: #6d6557; transition: transform .16s ease, background .16s ease;
}
.sw[aria-checked="true"]::after { transform: translateX(20px); background: var(--txt); }
.sw:focus-visible { outline: 2px solid var(--red-d); outline-offset: 2px; }

.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.acts .btn { font-size: 11.5px; padding: 6px 10px; }
.notice { margin: 8px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--txt-2); }
.notice.is-red { color: var(--red-d); }

/* ============================================================
   打印机（右边）
   ============================================================ */

.press { min-width: 0; }

.printer {
  background: #2b2721;
  border: 1px solid var(--edge-2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 26px -14px rgba(0,0,0,.9);
  padding: 14px 16px 0;
}

.pface { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
.pname { margin: 0; font-size: 12px; letter-spacing: .18em; color: var(--txt-2); }
.pstat { margin: 4px 0 0; font-size: 11.5px; color: #8d8474; min-height: 15px; }
.pstat.is-red { color: var(--red-d); }

.pbar { display: flex; gap: 2px; margin: 10px 0 0; }
.pbar i { flex: 1 1 0; height: 6px; background: var(--hair); }
.pbar i.on { background: var(--txt-2); }
.pbar i.hot { background: var(--red-d); }

.pbtn {
  font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .1em;
  padding: 11px 22px; cursor: pointer; white-space: nowrap;
  background: var(--paper); color: #1c1914; border: 1px solid var(--paper);
  box-shadow: 0 2px 0 #b9b3a4;
}
.pbtn:hover { background: #fff; }
.pbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 #b9b3a4; }
.pbtn[disabled] { opacity: .4; cursor: not-allowed; box-shadow: none; }
.pbtn:focus-visible { outline: 2px solid var(--red-d); outline-offset: 2px; }

/* 出纸口 */
.mouth {
  position: relative;
  height: 18px; margin: 12px -16px 0;
  background: #1a1713;
  border-top: 1px solid #0d0b09;
  box-shadow: inset 0 3px 6px rgba(0,0,0,.85);
}
.mouth::after {
  content: ''; position: absolute; left: 7%; right: 7%; bottom: 3px; height: 2px;
  background: var(--paper); opacity: 0;
}
.press.is-printing .mouth::after { opacity: .9; animation: flick .18s steps(2) infinite; }
@keyframes flick { 50% { opacity: .3; } }

/* 打印时的机械震动：幅度压到半个像素以内，只是"在动"，不晃眼 */
.press.is-printing .printer { animation: jit .09s steps(2) infinite; }
.press.is-printing .paper { animation: jit2 .11s steps(2) infinite; }
@keyframes jit  { 50% { transform: translateX(.4px); } }
@keyframes jit2 { 50% { transform: translateX(-.3px); } }

/* ---------- 纸带 ---------- */

.paper-wrap {
  max-height: min(64vh, 940px);
  overflow: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--edge-2) transparent;
}

/* 逐行打印：每行先是透明的，打印到它时显形 */
.rl { transition: opacity 70ms linear; }
.rl.pending { opacity: 0; }

.paper-empty { padding: 40px 0; text-align: center; font-size: 13px; line-height: 1.9; color: var(--ink-3); }

/* ---------- 小票排版 ---------- */

.r-c { text-align: center; }
.r-brand { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2em; }
.r-sub { margin: 5px 0 0; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-2); }

.r-dash { height: 0; margin: 13px 0; border-top: 1px dashed var(--rule); }

.r-line { display: flex; justify-content: space-between; gap: 12px; margin: 0; font-size: 12.5px; }
.r-line > span:first-child { color: var(--ink-3); }
.r-line > span:last-child { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.r-cap { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .2em; color: var(--ink-3); }
.r-big { margin: 0 0 12px; text-align: center; font-size: 33px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

.r-cap2 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .2em; color: var(--ink-3); }
.chart svg { display: block; width: 100%; height: auto; }
.chart__foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px; font-size: 10.5px; color: var(--ink-3); }

.bars { margin: 0; font-size: 12px; }
.bars__row { display: grid; grid-template-columns: 40px 1fr 62px 34px; gap: 0 8px; align-items: center; padding: 2.5px 0; }
.bars__cat { color: var(--ink-2); }
.bars__amt { text-align: right; font-variant-numeric: tabular-nums; }
.bars__pct { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 2px; }
.dots i { flex: 1 1 0; height: 9px; background: var(--rule); }
.dots i.on { background: var(--ink); }

/* 明细 */
.r-day {
  display: flex; justify-content: space-between; gap: 12px;
  margin: 11px 0 3px; padding-bottom: 3px;
  border-bottom: 1px solid var(--rule);
  font-size: 12.5px; color: var(--ink-2);
}
.r-day b { font-weight: 600; }
.r-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 8px; align-items: baseline; margin: 0; padding: 2px 0; font-size: 13px; }
.r-item > span:first-child { color: var(--ink-3); font-size: 11px; }
.r-item > span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; }
.r-item > span:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-item.is-in > span:last-child { font-weight: 600; }
.r-more { margin: 8px 0 0; font-size: 11px; color: var(--ink-3); text-align: center; }

.r-warn { margin: 0; font-size: 12px; line-height: 1.7; color: var(--red); }

.barcode { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin: 16px 0 8px; }
.barcode i { flex: 1 1 0; background: var(--ink); height: 100%; }
.r-footno, .r-bye { margin: 0; text-align: center; font-size: 11.5px; letter-spacing: .2em; color: var(--ink-3); }
.r-bye { color: var(--ink-2); margin-top: 5px; }

/* ============================================================
   流水工具条 / 筛选抽屉 / 条件 chips
   ============================================================ */

.ltool { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ltool .cap { margin: 0; }
.btn--ghost { font-size: 11.5px; padding: 5px 10px; letter-spacing: .08em; white-space: nowrap; }
.btn--ghost.is-on { color: var(--txt); border-color: var(--txt-2); }
.btn--ghost.is-on::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--red-d); vertical-align: 1px; }

.lchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.lchips[hidden] { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 11.5px;
  padding: 3px 8px; cursor: pointer;
  background: var(--panel-2); color: var(--txt-2);
  border: 1px solid var(--edge-2);
}
.chip:hover { color: var(--txt); border-color: var(--txt-2); }
.chip__x { color: var(--red-d); font-size: 12px; line-height: 1; }
.chip:focus-visible { outline: 2px solid var(--red-d); outline-offset: 1px; }

.ldrawer {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px;
  margin-top: 12px; padding-top: 14px;
  border-top: 1px dashed var(--edge);
}
.ldrawer[hidden] { display: none; }
.ldrawer .fld { margin-bottom: 8px; }
.ldrawer .fld--wide { grid-column: 1 / -1; }
.ldrawer .frow { grid-column: 1 / -1; margin-top: 2px; }
.ldrawer .frow .btn { flex: 0 0 auto; }

/* ============================================================
   设置（details 折叠）
   ============================================================ */

details.card { padding: 0; }
details.card > summary {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px; cursor: pointer;
  font-size: 10.5px; letter-spacing: .2em; color: var(--txt-2);
  list-style: none;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after {
  content: ''; width: 6px; height: 6px; flex: 0 0 6px;
  border-right: 1.5px solid var(--txt-2); border-bottom: 1.5px solid var(--txt-2);
  transform: rotate(-45deg); transition: transform .16s ease;
}
details.card[open] > summary::after { transform: rotate(45deg); }
details.card > summary:hover { color: var(--txt); }
details.card > summary:focus-visible { outline: 2px solid var(--red-d); outline-offset: -2px; }
.setbody { padding: 0 18px 18px; }
.setbody .cap { margin-top: 14px; }
.setbody .cap:first-child { margin-top: 4px; }
.acts--danger { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--edge); }
.acts--danger .btn { flex: 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================
   响应式：单列。顺序 = 表单 → 概览 → 流水 → 打印机 → 设置
   ============================================================ */

@media (max-width: 940px) {
  .app { grid-template-columns: 1fr; gap: 20px; }
  .main, .side { display: contents; }
  #entry { order: 1; }
  #stat { order: 2; }
  #list { order: 3; }
  #press { order: 4; }
  #settings { order: 5; }
  .paper-wrap { max-height: none; overflow: visible; }
}

@media (max-width: 560px) {
  .fgrid, .ldrawer { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; }
  .net__v { font-size: 23px; }
}

/* ============================================================
   动效偏好
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .press.is-printing .printer, .press.is-printing .paper { animation: none; }
  .rl { transition: none; }
  .sw::after { transition: none; }
}

/* ============================================================
   打印：只留纸
   ============================================================ */

@media print {
  @page { margin: 10mm; }
  body { background: #fff; padding: 0; }
  .app { display: block; max-width: none; }
  .topbar, .main, .side > .card, .printer, .teeth { display: none; }
  .press { max-width: none; }
  /* 打印时纸必须是完整高度：动画留下的内联 height/overflow 要用 !important 压掉，
     否则打印正在出纸的瞬间会只打出一截 */
  .paper-wrap { max-height: none !important; height: auto !important; overflow: visible !important; }
  .paper {
    width: 100%; box-shadow: none; background-image: none; padding: 0;
  }
  .rl { opacity: 1 !important; }
  .chart, .r-day { break-inside: avoid; }
}
</style>
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar__brand">
      <h1 class="brand">纸带流水</h1>
      <p class="tagline">记账 · 打印 · 一条纸带</p>
    </div>
    <p class="topbar__meta" id="top-meta"></p>
  </header>

  <!-- 主列：记与查 -->
  <main class="main">

    <!-- A 记一笔（L0 主动作） -->
    <section class="card card--entry" id="entry">
      <p class="cap" id="form-cap">新增一笔</p>
      <form id="f" novalidate autocomplete="off">
        <div class="seg" role="group" aria-label="类型">
          <button type="button" data-t="out" class="on">支出</button>
          <button type="button" data-t="in">收入</button>
        </div>

        <div class="fgrid">
          <div class="fld">
            <span>金额</span>
            <input name="amount" inputmode="decimal" placeholder="0.00" aria-describedby="e-amount">
            <p class="err" id="e-amount"></p>
          </div>

          <div class="fld">
            <span>日期</span>
            <input type="date" name="date" aria-describedby="e-date">
            <p class="err" id="e-date"></p>
          </div>

          <div class="fld">
            <span>分类</span>
            <select name="cat" aria-describedby="e-cat"></select>
            <p class="err" id="e-cat"></p>
          </div>

          <div class="fld">
            <span>备注<span class="hint"><span id="note-n">0</span>/60</span></span>
            <input name="note" maxlength="60" placeholder="可省">
          </div>
        </div>

        <div class="frow">
          <button type="submit" class="btn btn--primary" id="save-btn">记下这一笔</button>
          <button type="button" class="btn" id="cancel-btn" hidden>取消编辑</button>
        </div>
      </form>
    </section>

    <!-- B 流水（L2 主体内容） -->
    <section class="card" id="list">
      <div class="ltool">
        <p class="cap">流水 <span class="n" id="list-n"></span></p>
        <button type="button" class="btn btn--ghost" id="f-toggle" aria-expanded="false" aria-controls="f-drawer">筛选</button>
      </div>

      <div class="lchips" id="f-chips" hidden></div>

      <div class="ldrawer" id="f-drawer" hidden>
        <div class="fld"><span>从</span><input type="date" id="f-from"></div>
        <div class="fld"><span>到</span><input type="date" id="f-to"></div>
        <div class="fld"><span>分类</span><select id="f-cat"></select></div>
        <div class="fld"><span>类型</span>
          <select id="f-type">
            <option value="">全部</option>
            <option value="out">支出</option>
            <option value="in">收入</option>
          </select>
        </div>
        <div class="fld fld--wide"><span>关键词（备注 / 分类）</span><input id="f-q" placeholder="如：咖啡"></div>
        <div class="frow"><button type="button" class="btn" id="f-clear">清空筛选</button></div>
      </div>

      <ol class="rows" id="rows"></ol>
    </section>

  </main>

  <!-- 右列：看与打 -->
  <aside class="side">

    <!-- C 账目概览（L1 结果反馈） -->
    <section class="card" id="stat">
      <p class="cap">账目概览</p>
      <p class="net">
        <span class="net__label">净结余 · 当前范围</span>
        <span class="net__v" id="stat-net"></span>
      </p>
      <dl class="tri" id="stat-sub"></dl>
      <p class="cap cap--sub">支出分类占比</p>
      <div id="stat-cats"></div>
      <div class="stat__rule"></div>
      <div id="budget-box">
        <button type="button" class="btn btn--lite" id="b-set">+ 设个月度预算</button>
        <div class="brow" id="b-row" hidden>
          <span class="brow__lab">月度预算</span>
          <input type="number" id="s-budget" min="0" step="100" placeholder="0 = 不设">
          <button type="button" class="sw" id="s-budgon" role="switch" aria-checked="false" aria-label="启用预算提醒"></button>
        </div>
        <div id="b-view"></div>
      </div>
      <p class="stat__scope">合计随筛选范围变化 · 预算按自然月</p>
    </section>

    <!-- D 热敏打印机（L3 特色锚点） -->
    <section class="press" id="press">
      <div class="printer">
        <div class="pface">
          <div>
            <p class="pname">热敏打印 · 58mm</p>
            <p class="pstat" id="pstat">待机</p>
          </div>
          <button type="button" class="pbtn" id="p-btn">打印账单</button>
        </div>
        <div class="pbar" id="pbar" aria-hidden="true"></div>
        <div class="mouth" aria-hidden="true"></div>
      </div>

      <div class="paper-wrap" id="paper-wrap">
        <div class="paper" id="paper" aria-live="polite"></div>
      </div>
    </section>

    <!-- E 设置与数据（L5 折叠收纳） -->
    <details class="card" id="settings">
      <summary>设置与数据</summary>
      <div class="setbody">
        <p class="cap">账单</p>
        <div class="opt"><span>打印音效</span><button type="button" class="sw" id="s-sound" role="switch" aria-checked="false" aria-label="打印音效"></button></div>
        <div class="opt"><span>账单含逐笔明细</span><button type="button" class="sw" id="s-detail" role="switch" aria-checked="true" aria-label="账单含逐笔明细"></button></div>

        <p class="cap">数据</p>
        <div class="acts">
          <button type="button" class="btn" id="a-csv">导出 CSV</button>
          <button type="button" class="btn" id="a-json">导出 JSON</button>
          <button type="button" class="btn" id="a-import">导入 JSON</button>
          <button type="button" class="btn" id="a-demo">载入示例数据</button>
          <input type="file" id="a-file" accept=".json,application/json" hidden>
        </div>
        <p class="notice" id="io-note">导入会把文件里的记录并进当前数据，按编号去重，不会覆盖已有内容。</p>

        <div class="acts acts--danger"><button type="button" class="btn btn--danger" id="a-wipe">清空全部数据</button></div>
      </div>
    </details>

  </aside>

</div>

<script>
'use strict';
(function () {

  /* ==========================================================
     常量与状态
     ========================================================== */

  var KEY = 'roll.v1';
  var MAX_AMOUNT = 99999999;
  var MAX_ROWS_IN_RECEIPT = 300;   // 明细超过这个数就不全打，避免纸带无限长
  var DOTS = 26;                   // 分类占比的点阵块数
  var PBLOCKS = 24;                // 打印进度的点阵块数

  var CATS = {
    out: ['餐饮', '交通', '居家', '学习', '娱乐', '医疗', '人情', '通讯', '其他'],
    in:  ['工资', '闲置', '报销', '红包', '其他']
  };
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  var DEFAULTS = { entries: [], budget: 3000, budgetOn: true, sound: false, detail: true };

  var state = load();
  var filter = { from: '', to: '', cat: '', type: '', q: '' };
  var editingId = null;
  var printing = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ==========================================================
     工具
     ========================================================== */

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function shortDate(iso) { return iso.slice(5).replace('-', '.'); }
  function weekday(iso) { return '周' + WEEK[new Date(iso + 'T00:00:00').getDay()]; }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULTS));
      var o = JSON.parse(raw);
      return {
        entries: Array.isArray(o.entries) ? o.entries.map(sanitize) : [],
        budget: Number(o.budget) > 0 ? Number(o.budget) : 0,
        budgetOn: !!o.budgetOn,
        sound: !!o.sound,
        detail: o.detail !== false
      };
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
  }

  function sanitize(e) {
    return {
      id: String(e && e.id || uid()),
      type: e && e.type === 'in' ? 'in' : 'out',
      amount: Math.min(MAX_AMOUNT, Math.max(0, Number(e && e.amount) || 0)),
      cat: String(e && e.cat || '其他').slice(0, 20),
      date: /^\d{4}-\d{2}-\d{2}$/.test(e && e.date) ? e.date : todayISO(),
      note: String(e && e.note || '').slice(0, 60)
    };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) {
      ioNote('本机存储写不进去了（可能是隐私模式或空间已满）。数据还在内存里，但刷新会丢。', true);
      return false;
    }
  }

  /* ==========================================================
     音效：点阵打印机的短噪声脉冲。全部现场合成，不加载任何文件。
     ========================================================== */

  var ac = null;
  function ctx() {
    if (!state.sound) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }

  function tick() {
    var c = ctx(); if (!c) return;
    var len = Math.floor(c.sampleRate * 0.012);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 1700 + Math.random() * 700; f.Q.value = 1.1;
    var g = c.createGain(); g.gain.value = 0.045;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start();
  }

  function beep() {   // 打完的一声
    var c = ctx(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 1180;
    g.gain.setValueAtTime(0.03, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.1);
  }

  function tear() {   // 撕纸
    var c = ctx(); if (!c) return;
    var len = Math.floor(c.sampleRate * 0.22);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var k = i / len;
      d[i] = (Math.random() * 2 - 1) * (0.35 + 0.65 * Math.abs(Math.sin(k * 47))) * (1 - k);
    }
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1400;
    var g = c.createGain(); g.gain.value = 0.05;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start();
  }

  /* ==========================================================
     数据操作
     ========================================================== */

  function filtered() {
    var arr = state.entries.slice();
    if (filter.type) arr = arr.filter(function (e) { return e.type === filter.type; });
    if (filter.cat) arr = arr.filter(function (e) { return e.cat === filter.cat; });
    if (filter.from) arr = arr.filter(function (e) { return e.date >= filter.from; });
    if (filter.to) arr = arr.filter(function (e) { return e.date <= filter.to; });
    if (filter.q) {
      var q = filter.q.toLowerCase();
      arr = arr.filter(function (e) {
        return (e.note || '').toLowerCase().indexOf(q) >= 0 || e.cat.toLowerCase().indexOf(q) >= 0;
      });
    }
    arr.sort(function (a, b) { return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
    return arr;
  }

  function stats(arr) {
    var out = 0, inc = 0, oc = 0, ic = 0, byCat = {}, byDay = {};
    arr.forEach(function (e) {
      if (e.type === 'out') {
        out += e.amount; oc++;
        byCat[e.cat] = (byCat[e.cat] || 0) + e.amount;
        byDay[e.date] = (byDay[e.date] || 0) + e.amount;
      } else { inc += e.amount; ic++; }
    });
    var cats = Object.keys(byCat).map(function (k) { return [k, byCat[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    var days = Object.keys(byDay).sort();
    return { out: out, inc: inc, net: inc - out, oc: oc, ic: ic, cats: cats, days: days, n: arr.length };
  }

  function monthOut() {
    var m = todayISO().slice(0, 7);
    return state.entries.filter(function (e) { return e.type === 'out' && e.date.slice(0, 7) === m; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
  }

  /* ==========================================================
     渲染 · 控制台
     ========================================================== */

  var fType = 'out';   // 表单当前类型

  function fillCatSelect(sel, withAll) {
    var html = withAll ? '<option value="">全部分类</option>' : '';
    html += '<optgroup label="支出">' + CATS.out.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') + '</optgroup>';
    html += '<optgroup label="收入">' + CATS.in.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') + '</optgroup>';
    sel.innerHTML = html;
  }

  function syncCatOptions() {
    var list = CATS[fType];
    $('#f [name="cat"]').innerHTML = list.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  }

  function setFormType(t) {
    fType = t;
    $$('#f .seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    syncCatOptions();
  }

  function clearErrors() {
    ['amount', 'cat', 'date'].forEach(function (k) {
      var el = $('#f [name="' + k + '"]');
      el.classList.remove('bad'); el.removeAttribute('aria-invalid');
      $('#e-' + k).textContent = '';
    });
  }

  function showErr(k, msg) {
    var el = $('#f [name="' + k + '"]');
    el.classList.add('bad'); el.setAttribute('aria-invalid', 'true');
    $('#e-' + k).textContent = msg;
  }

  function validate() {
    clearErrors();
    var ok = true, first = null;
    var aRaw = $('#f [name="amount"]').value.trim();
    var dRaw = $('#f [name="date"]').value.trim();

    if (!aRaw) { showErr('amount', '金额要填。'); ok = false; first = first || 'amount'; }
    else if (!/^\d+(\.\d{1,2})?$/.test(aRaw)) { showErr('amount', '金额只能是数字，最多两位小数。'); ok = false; first = first || 'amount'; }
    else if (Number(aRaw) <= 0) { showErr('amount', '金额要大于 0。'); ok = false; first = first || 'amount'; }
    else if (Number(aRaw) > MAX_AMOUNT) { showErr('amount', '单笔上限 ' + money(MAX_AMOUNT) + ' 元。'); ok = false; first = first || 'amount'; }

    if (!dRaw) { showErr('date', '日期要选。'); ok = false; first = first || 'date'; }
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(dRaw) || isNaN(new Date(dRaw + 'T00:00:00').getTime())) {
      showErr('date', '日期格式不对。'); ok = false; first = first || 'date';
    } else if (dRaw < '2000-01-01') { showErr('date', '日期不能早于 2000 年。'); ok = false; first = first || 'date'; }
    else if (dRaw > addDays(todayISO(), 366)) { showErr('date', '日期最多填到一年后。'); ok = false; first = first || 'date'; }

    if (first) { $('#f [name="' + first + '"]').focus(); }
    return ok ? { amount: Number(aRaw), date: dRaw } : null;
  }

  /* 顶栏元信息：多少笔 · 最近什么时候记的 */
  function renderMeta() {
    var el = $('#top-meta');
    if (!state.entries.length) { el.textContent = '还没有记录'; return; }
    var latest = state.entries[0].date;
    state.entries.forEach(function (e) { if (e.date > latest) latest = e.date; });
    el.textContent = state.entries.length + ' 笔 · 最近记于 ' + shortDate(latest);
  }

  /* 激活的筛选条件 → 可单独移除的 chips */
  function activeFilters() {
    var items = [];
    if (filter.from) items.push(['from', '从 ' + shortDate(filter.from)]);
    if (filter.to) items.push(['to', '到 ' + shortDate(filter.to)]);
    if (filter.type) items.push(['type', filter.type === 'out' ? '仅支出' : '仅收入']);
    if (filter.cat) items.push(['cat', filter.cat]);
    if (filter.q) items.push(['q', '“' + filter.q + '”']);
    return items;
  }

  function renderChips() {
    var box = $('#f-chips'), items = activeFilters();
    $('#f-toggle').classList.toggle('is-on', items.length > 0);
    if (!items.length) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    box.innerHTML = items.map(function (it) {
      return '<button type="button" class="chip" data-k="' + it[0] + '" aria-label="移除条件：' + esc(it[1]) + '">' +
        esc(it[1]) + '<span class="chip__x" aria-hidden="true">×</span></button>';
    }).join('');
  }

  function clearFilterKey(k) {
    filter[k] = '';
    if (k === 'from') $('#f-from').value = '';
    if (k === 'to') $('#f-to').value = '';
    if (k === 'cat') $('#f-cat').value = '';
    if (k === 'type') $('#f-type').value = '';
    if (k === 'q') $('#f-q').value = '';
    renderAll(); buildReceipt();
  }

  function renderList() {
    var arr = filtered(), box = $('#rows');
    $('#list-n').textContent = '(' + arr.length + ')';
    if (!arr.length) {
      box.innerHTML = '<li class="row-empty">' + (state.entries.length
        ? '这个筛选下没有记录。<br>把条件放宽一点，或者清掉上面的筛选。'
        : '还没有记录。<br>记下第一笔，再让打印机出一张账单。') + '</li>';
    } else {
      var html = '', last = '';
      arr.forEach(function (e) {
        if (e.date !== last) {
          last = e.date;
          var dOut = arr.filter(function (x) { return x.date === e.date && x.type === 'out'; })
            .reduce(function (a, b) { return a + b.amount; }, 0);
          html += '<li class="dhead"><b>' + shortDate(e.date) + ' ' + weekday(e.date) + '</b>' +
            '<span>当日支出 ¥ ' + money(dOut) + '</span></li>';
        }
        var ops = '<span class="row__ops">' +
          '<button type="button" data-act="edit" data-id="' + e.id + '">改</button>' +
          '<button type="button" data-act="del" data-id="' + e.id + '">删</button></span>';
        html += '<li class="row' + (e.id === editingId ? ' is-edit' : '') + '">' +
          '<span class="row__c">' + esc(e.cat) + '</span>' +
          '<span class="row__n">' + (e.note ? esc(e.note) : '<span style="color:#6d6557">—</span>') + '</span>' +
          '<span class="row__a' + (e.type === 'in' ? ' in' : '') + '">' + (e.type === 'in' ? '+ ' : '') + money(e.amount) + '</span>' +

  function renderStats() {
    var arr = filtered(), s = stats(arr);
    var net = $('#stat-net');
    net.textContent = (s.net >= 0 ? '+ ¥ ' : '− ¥ ') + money(Math.abs(s.net));
    net.className = 'net__v' + (s.net < 0 ? ' is-neg' : '');
    $('#stat-sub').innerHTML =
      '<div><dt>支出合计</dt><dd class="is-red">¥ ' + money(s.out) + '</dd></div>' +
      '<div><dt>收入合计</dt><dd class="is-ok">¥ ' + money(s.inc) + '</dd></div>' +
      '<div><dt>笔数</dt><dd>' + s.oc + ' 支 / ' + s.ic + ' 收</dd></div>';

      for (var i = 0; i < DOTS; i++) dots += '<i class="' + (i < on ? 'on' : '') + '"></i>';
      return '<div class="bars__row"><span class="bars__cat">' + esc(c[0]) + '</span>' +
        '<span class="dots">' + dots + '</span>' +
        '<span class="bars__amt">' + money(c[1]) + '</span>' +
        '<span class="bars__pct">' + Math.round(c[1] / s.out * 100) + '%</span></div>';

  function renderBudget() {
    $('#b-set').hidden = !!state.budgetOn;
    $('#b-row').hidden = !state.budgetOn;
    $('#s-budget').value = state.budget || '';
    $('#s-budgon').setAttribute('aria-checked', String(!!state.budgetOn));

    var view = $('#b-view');
    if (!state.budgetOn) { view.innerHTML = ''; return; }
    if (!state.budget) {
      view.innerHTML = '<p class="notice">填个金额并保持开关打开，超支时就会提醒。</p>';
      return;
    }
    var spent = monthOut(), pct = spent / state.budget;
    var over = spent > state.budget;
    var fill = Math.min(1, pct);
    var on = Math.round(fill * DOTS);
    var dots = '';
    for (var i = 0; i < DOTS; i++) dots += '<i class="' + (i < on ? (over ? 'hot' : 'on') : '') + '"></i>';
    view.innerHTML =
      '<div class="bbar">' + dots + '</div>' +
      '<p class="bnote' + (over ? ' is-red' : '') + '">' +
      todayISO().slice(0, 7) + ' 已支出 ¥ ' + money(spent) + ' / 预算 ¥ ' + money(state.budget) +
      '（' + Math.round(pct * 100) + '%）' +
      (over ? '　—— 已超出 ¥ ' + money(spent - state.budget) : '') +
      '</p>';
  }

  /* ==========================================================
     渲染 · 小票
     ========================================================== */

  function svgBars(days, map, firstD, lastD, peak) {
    var W = 400, BASE = 88, HMAX = 70, GAP = 2, n = days.length;
    var bw = (W - GAP * (n - 1)) / n;
    var rects = days.map(function (d, i) {
      var v = map[d] || 0;
      var h = peak ? Math.max(1.2, v / peak * HMAX) : 1.2;
      var x = i * (bw + GAP);
      return '<rect x="' + x.toFixed(2) + '" y="' + (BASE - h).toFixed(2) + '" width="' + bw.toFixed(2) +
        '" height="' + h.toFixed(2) + '" fill="' + (v === peak ? 'var(--red)' : 'var(--ink)') + '"/>';
    }).join('');
    var line = '<line x1="0" y1="' + (BASE + .5) + '" x2="400" y2="' + (BASE + .5) +
      '" stroke="var(--rule)" stroke-dasharray="2 3"/>';
    return '<div class="chart"><svg viewBox="0 0 400 ' + (BASE + 6) + '" role="img" aria-label="每日支出柱状图">' +
      line + rects + '</svg>' +
      '<p class="chart__foot rl"><span>' + shortDate(firstD) + '</span><span>峰值 ¥ ' + money(peak) + '</span><span>' + shortDate(lastD) + '</span></p></div>';
  }

  function buildReceipt() {
    var arr = filtered(), s = stats(arr), paper = $('#paper');
    var rows = [];

    function L(html, cls) { rows.push('<p class="rl ' + (cls || 'r-line') + '">' + html + '</p>'); }
    function D() { rows.push('<div class="rl r-dash"></div>'); }

    if (!arr.length) {
      paper.innerHTML = '<p class="paper-empty rl">' + (state.entries.length
        ? '这个筛选下没有记录。<br>在流水卡片上清掉筛选，或者把条件放宽。<br><br>然后再按一次「打印账单」。'
        : '还没有记录。<br>在「记一笔」里记下第一笔。<br><br>这里会打出你的账单小票。') + '</p>';
      return;
    }

    var firstD = arr[arr.length - 1].date, lastD = arr[0].date;
    var anyFilter = filter.from || filter.to || filter.cat || filter.type || filter.q;
    var serial = 'R-' + todayISO().replace(/-/g, '') + '-' + String(arr.length).padStart(4, '0');

    /* 店头 */
    L('纸带流水', 'r-brand r-c');
    L('记账小票 · 按当前筛选打印', 'r-sub r-c');
    D();
    L('<span>范围</span><span>' + shortDate(firstD) + ' – ' + shortDate(lastD) + '</span>');
    L('<span>筛选</span><span>' + (anyFilter ? filterLabel() : '全部记录') + '</span>');
    L('<span>单号</span><span>' + serial + '</span>');
    L('<span>打印</span><span>' + todayISO() + ' ' + new Date().toTimeString().slice(0, 5) + '</span>');
    D();

    /* 合计 */
    L('支出合计', 'r-cap r-c');
    L('¥ ' + money(s.out), 'r-big');
    L('<span>收入合计</span><span>¥ ' + money(s.inc) + '</span>');
    L('<span>净结余</span><span>' + (s.net >= 0 ? '+ ¥ ' : '− ¥ ') + money(Math.abs(s.net)) + '</span>');
    L('<span>笔数</span><span>' + s.oc + ' 支 / ' + s.ic + ' 收</span>');
    if (s.oc) L('<span>日均支出</span><span>¥ ' + money(s.out / Math.max(1, (new Date(lastD) - new Date(firstD)) / 86400000 + 1)) + '</span>');
    D();

    /* 预算 */
    if (state.budgetOn && state.budget) {
      var spent = monthOut(), pct = spent / state.budget, over = spent > state.budget;
      L('<span>本月预算</span><span>¥ ' + money(state.budget) + '</span>');
      L('<span>本月已支出</span><span>¥ ' + money(spent) + '（' + Math.round(pct * 100) + '%）</span>');
      if (over) L('已超出预算 ¥ ' + money(spent - state.budget) + '。这个月剩下的日子要省着点。', 'r-warn');
      D();
    }

    /* 每日支出：把范围内的每一天都铺出来（包括没花钱的日子），柱子才有节奏 */
    var span = Math.round((new Date(lastD) - new Date(firstD)) / 86400000) + 1;
    var peak = 0, map = {};
    arr.forEach(function (e) {
      if (e.type !== 'out') return;
      map[e.date] = (map[e.date] || 0) + e.amount;
      if (map[e.date] > peak) peak = map[e.date];
    });

    L('每日支出', 'r-cap2');
    if (span <= 62) {
      var all = [], cur = firstD;
      for (var i = 0; i < span; i++) { all.push(cur); cur = addDays(cur, 1); }
      rows.push('<div class="rl">' + svgBars(all, map, firstD, lastD, peak) + '</div>');
    } else {
      L('范围超过 62 天，每日图略去。', 'r-line');
    }
    D();

    /* 分类占比 */
    if (s.cats.length) {
      L('花在哪了', 'r-cap2');
      var maxC = s.cats[0][1];
      var catHtml = '<div class="bars">' + s.cats.map(function (c) {
        var on = Math.max(1, Math.round(c[1] / maxC * DOTS));
        var dots = '';
        for (var j = 0; j < DOTS; j++) dots += '<i class="' + (j < on ? 'on' : '') + '"></i>';
        return '<div class="bars__row"><span class="bars__cat">' + esc(c[0]) + '</span>' +
          '<span class="dots">' + dots + '</span>' +
          '<span class="bars__amt">' + money(c[1]) + '</span>' +
          '<span class="bars__pct">' + Math.round(c[1] / s.out * 100) + '%</span></div>';
      }).join('') + '</div>';
      rows.push('<div class="rl">' + catHtml + '</div>');
      D();
    }

    /* 明细 */
    if (state.detail) {
      L('明细', 'r-cap2');
      var shown = arr.slice(0, MAX_ROWS_IN_RECEIPT);
      var lastDate = '';
      shown.forEach(function (e) {
        if (e.date !== lastDate) {
          lastDate = e.date;
          var dOut = arr.filter(function (x) { return x.date === e.date && x.type === 'out'; })
            .reduce(function (a, b) { return a + b.amount; }, 0);
          rows.push('<p class="rl r-day"><b>' + shortDate(e.date) + ' ' + weekday(e.date) + '</b>' +
            '<span>' + money(dOut) + '</span></p>');
        }
        rows.push('<p class="rl r-item' + (e.type === 'in' ? ' is-in' : '') + '">' +
          '<span>' + esc(e.cat) + '</span><span>' + (e.note ? esc(e.note) : '—') + '</span>' +
          '<span>' + (e.type === 'in' ? '+ ' : '') + money(e.amount) + '</span></p>');
      });
      if (arr.length > shown.length) {
        L('还有 ' + (arr.length - shown.length) + ' 笔没打（纸带太长会断）。改小范围或关掉明细。', 'r-more');
      }
      D();
    }

    /* 页脚 */
    var BARS = [3,1,1,2,1,3,2,1,1,1,3,1,2,2,1,1,3,1,1,2,3,1,1,2,1,1,3,2,1,2,1,1,3,1,2,1,1,3,1,2,2,1,1,3,1,1,2,1,3,1];
    rows.push('<div class="rl barcode" aria-hidden="true">' + BARS.map(function (w) { return '<i style="flex:' + w + ' 0 0"></i>'; }).join('') + '</div>');
    L(serial, 'r-footno r-c');
    L('谢谢惠顾 · 明天继续记', 'r-bye r-c');

    paper.innerHTML = rows.join('') + '<div class="teeth" aria-hidden="true"></div>';
  }

  function filterLabel() {
    var p = [];
    if (filter.from || filter.to) p.push('日期 ' + (filter.from ? shortDate(filter.from) : '…') + '–' + (filter.to ? shortDate(filter.to) : '…'));
    if (filter.type) p.push(filter.type === 'out' ? '仅支出' : '仅收入');
    if (filter.cat) p.push(filter.cat);
    if (filter.q) p.push('“' + filter.q + '”');
    return p.length ? esc(p.join(' · ')) : '全部记录';
  }

  /* ==========================================================
     打印动画
     ========================================================== */

  function setProgress(done, total, label, hot) {
    var on = Math.round(Math.min(1, done / Math.max(1, total)) * PBLOCKS);
    var h = '';
    for (var i = 0; i < PBLOCKS; i++) h += '<i class="' + (i < on ? (hot ? 'hot' : 'on') : '') + '"></i>';
    $('#pbar').innerHTML = h;
    $('#pstat').textContent = label;
    $('#pstat').className = 'pstat' + (hot ? ' is-red' : '');
  }

  function doPrint(fast) {
    if (printing) return;
    buildReceipt();
    var wrap = $('#paper-wrap'), paper = $('#paper'), press = $('#press');
    var rows = $$('.rl', paper);

    setProgress(0, 1, fast ? '快速出纸…' : '准备…', false);

    if (!rows.length) { setProgress(0, 1, '没东西可打', true); return; }

    printing = true;
    $('#p-btn').disabled = true;
    press.classList.add('is-printing');
    rows.forEach(function (r) { r.classList.add('pending'); });

    var total = rows.length;
    var dur = reduceMotion ? 0 : (fast ? 900 : Math.max(1400, Math.min(4600, total * 26)));
    var t0 = performance.now();
    var shown = 0, lastTick = 0;

    function finish() {
      wrap.style.height = '';
      wrap.style.overflowY = 'auto';
      wrap.scrollTop = 0;          // 打完了，从抬头开始读
      press.classList.remove('is-printing');
      printing = false;
      $('#p-btn').disabled = false;
      var secs = ((performance.now() - t0) / 1000).toFixed(1);
      setProgress(total, total, '完成 · ' + total + ' 行 · ' + secs + 's', false);
      beep(); tear();
    }

    if (!dur) {   // 减少动效：直接出
      rows.forEach(function (r) { r.classList.remove('pending'); });
      finish();
      return;
    }

    wrap.style.overflowY = 'hidden';
    /* 先读出上限，后面每一帧都把"打印头"顶在可视区底边 */
    var maxH = Math.round(parseFloat(getComputedStyle(wrap).maxHeight)) || 800;
    wrap.style.height = '0px';

    function frame(now) {
      var p = Math.min(1, (now - t0) / dur);
      var target = Math.max(1, Math.floor(p * total));
      if (target > shown) {
        for (var i = shown; i < target; i++) rows[i].classList.remove('pending');
        shown = target;
        var last = rows[shown - 1];
        var headY = last.offsetTop + last.offsetHeight;      // 打印头在整卷纸里的位置
        var vis = Math.min(headY, maxH);                     // 可视区高度
        wrap.style.height = vis + 'px';
        /* 不能直接滚到底：那会跳到撕口。要滚到"打印头刚好在底边" */
        wrap.scrollTop = Math.max(0, headY - vis);
        setProgress(shown, total, '打印中 ' + shown + '/' + total + ' 行 · ' + Math.round(p * 100) + '%', false);
        if (now - lastTick > 24) { tick(); lastTick = now; }
      }
      if (p < 1) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  }

  /* ==========================================================
     导入导出
     ========================================================== */

  function ioNote(msg, bad) {
    var el = $('#io-note');
    el.textContent = msg;
    el.className = 'notice' + (bad ? ' is-red' : '');
  }

  function download(text, name, mime) {
    var b = new Blob([text], { type: mime });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 800);
  }

  function exportCSV() {
    var arr = filtered();
    if (!arr.length) { ioNote('当前筛选下没有记录，CSV 是空的。', true); return; }
    var rows = [['类型', '日期', '分类', '金额', '备注']];
    arr.forEach(function (e) {
      rows.push([e.type === 'out' ? '支出' : '收入', e.date, e.cat, e.amount.toFixed(2), e.note || '']);
    });
    var csv = '\uFEFF' + rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download(csv, 'roll-' + todayISO() + '.csv', 'text/csv;charset=utf-8');
    ioNote('已导出 ' + arr.length + ' 笔为 CSV（带 BOM，Excel 直接打开不乱码）。');
  }

  function exportJSON() {
    download(JSON.stringify(state, null, 2), 'roll-backup-' + todayISO() + '.json', 'application/json');
    ioNote('已导出全部数据 ' + state.entries.length + ' 笔。');
  }

  function importJSON(file) {
    var r = new FileReader();
    r.onerror = function () { ioNote('文件读不出来。', true); };
    r.onload = function () {
      var o;
      try { o = JSON.parse(r.result); }
      catch (e) { ioNote('不是合法的 JSON。', true); return; }
      if (!o || !Array.isArray(o.entries)) { ioNote('文件里缺少 entries 数组，不是本工具的备份。', true); return; }
      var have = {};
      state.entries.forEach(function (e) { have[e.id] = 1; });
      var add = 0, skip = 0;
      o.entries.map(sanitize).forEach(function (e) {
        if (e.amount <= 0) { skip++; return; }
        if (have[e.id]) { skip++; return; }
        have[e.id] = 1; state.entries.push(e); add++;
      });
      save(); renderAll();
      ioNote('导入完成：新增 ' + add + ' 笔，跳过 ' + skip + ' 笔（编号重复或金额无效）。当前共 ' + state.entries.length + ' 笔。');
    };
    r.readAsText(file);
  }

  /* ==========================================================
     事件绑定
     ========================================================== */

  fillCatSelect($('#f-cat'), true);
  setFormType('out');
  $('#f [name="date"]').value = todayISO();

  /* 类型切换 */
  $('#f .seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    setFormType(b.dataset.t);
  });

  /* 备注计数 */
  $('#f [name="note"]').addEventListener('input', function () {
    $('#note-n').textContent = this.value.length;
  });

  /* 输入时清掉自己的错误 */
  ['amount', 'cat', 'date'].forEach(function (k) {
    $('#f [name="' + k + '"]').addEventListener('input', function () {
      this.classList.remove('bad'); this.removeAttribute('aria-invalid');
      $('#e-' + k).textContent = '';
    });
  });

  /* 提交（新增或保存编辑） */
  $('#f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = validate();
    if (!v) return;
    var note = $('#f [name="note"]').value.trim();
    var cat = $('#f [name="cat"]').value;

    if (editingId) {
      var e = state.entries.find(function (x) { return x.id === editingId; });
      if (e) { e.type = fType; e.amount = v.amount; e.cat = cat; e.date = v.date; e.note = note; }
      stopEdit();
    } else {
      state.entries.push({ id: uid(), type: fType, amount: v.amount, cat: cat, date: v.date, note: note });
    }
    save();
    $('#f [name="amount"]').value = '';
    $('#f [name="note"]').value = '';
    $('#note-n').textContent = '0';
    $('#f [name="amount"]').focus();
    renderAll();
    buildReceipt();   // 静默刷新纸带，不重播动画
    flashSaved();
  });

  /* 保存成功：主按钮闪一下「已记下」，补上缺失的保存反馈 */
  var flashT = null;
  function flashSaved() {
    var btn = $('#save-btn');
    btn.textContent = '已记下 ✓';
    btn.classList.add('is-done');
    clearTimeout(flashT);
    flashT = setTimeout(function () {
      btn.classList.remove('is-done');
      btn.textContent = editingId ? '保存修改' : '记下这一笔';
    }, 900);
  }

  function stopEdit() {
    editingId = null;
    $('#entry').classList.remove('is-editing');
    $('#form-cap').textContent = '新增一笔';
    $('#save-btn').textContent = '记下这一笔';
    $('#cancel-btn').hidden = true;
    $('#f [name="amount"]').value = '';
    $('#f [name="note"]').value = '';
    $('#note-n').textContent = '0';
    $('#f [name="date"]').value = todayISO();
  }

  $('#cancel-btn').addEventListener('click', function () { stopEdit(); renderList(); });

  /* 列表：改 / 删（删除用两段确认，不弹系统对话框） */
  $('#rows').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var id = b.dataset.id;

    if (b.dataset.act === 'edit') {
      var e = state.entries.find(function (x) { return x.id === id; });
      if (!e) return;
      editingId = id;
      setFormType(e.type);
      $('#f [name="amount"]').value = e.amount.toFixed(2);
      $('#f [name="cat"]').value = e.cat;
      $('#f [name="date"]').value = e.date;
      $('#f [name="note"]').value = e.note || '';
      $('#note-n').textContent = (e.note || '').length;
      $('#entry').classList.add('is-editing');
      $('#form-cap').textContent = '编辑这一笔 · ' + id.slice(-4);
      $('#save-btn').textContent = '保存修改';
      $('#cancel-btn').hidden = false;
      clearErrors();
      renderList();
      $('#f [name="amount"]').focus();
      $('#entry').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    }

    if (b.dataset.act === 'del') {
      if (b.dataset.arm) {
        state.entries = state.entries.filter(function (x) { return x.id !== id; });
        if (editingId === id) stopEdit();
        save(); renderAll(); buildReceipt();
      } else {
        b.dataset.arm = '1'; b.textContent = '确定?'; b.classList.add('is-arm');
        setTimeout(function () {
          if (!b.isConnected) return;
          b.dataset.arm = ''; b.textContent = '删'; b.classList.remove('is-arm');
        }, 3500);
      }
    }
  });

  /* 筛选 */
  function bindFilter(id, key, ev) {
    $(id).addEventListener(ev || 'input', function () { filter[key] = this.value.trim(); renderAll(); buildReceipt(); });
  }
  bindFilter('#f-from', 'from', 'change');
  bindFilter('#f-to', 'to', 'change');
  bindFilter('#f-cat', 'cat', 'change');
  bindFilter('#f-type', 'type', 'change');
  bindFilter('#f-q', 'q');
  $('#f-clear').addEventListener('click', function () {
    filter = { from: '', to: '', cat: '', type: '', q: '' };
    $('#f-from').value = $('#f-to').value = $('#f-q').value = '';
    $('#f-cat').value = ''; $('#f-type').value = '';
    renderAll(); buildReceipt();
  });

  /* 筛选抽屉：默认收起，按需展开 */
  $('#f-toggle').addEventListener('click', function () {
    var d = $('#f-drawer'), open = d.hidden;
    d.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
    if (open) $('#f-from').focus();
  });

  /* 条件 chips：点一下移除对应条件，不用重开抽屉 */
  $('#f-chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    clearFilterKey(b.dataset.k);
  });

  /* 预算：概览卡里的轻按钮，原地展开行内设置 */
  $('#b-set').addEventListener('click', function () {
    state.budgetOn = true;
    save(); renderBudget(); buildReceipt();
    $('#s-budget').focus();
  });

  /* 设置 */
  $('#s-budget').addEventListener('input', function () {
    state.budget = Math.max(0, Number(this.value) || 0);
    save(); renderBudget(); buildReceipt();
  });
  function bindSwitch(id, key, after) {
    $(id).addEventListener('click', function () {
      state[key] = !state[key];
      this.setAttribute('aria-checked', String(state[key]));
      save(); if (after) after();
    });
  }
  bindSwitch('#s-budgon', 'budgetOn', function () { renderBudget(); buildReceipt(); });
  bindSwitch('#s-sound', 'sound', function () { if (state.sound) tick(); });
  bindSwitch('#s-detail', 'detail', function () { buildReceipt(); });

  /* 导入导出 */
  $('#a-csv').addEventListener('click', exportCSV);
  $('#a-json').addEventListener('click', exportJSON);
  $('#a-import').addEventListener('click', function () { $('#a-file').click(); });
  $('#a-file').addEventListener('change', function () {
    if (this.files && this.files[0]) importJSON(this.files[0]);
    this.value = '';
  });

  /* 示例数据：确定性伪随机，每次生成的一样；只在空库时允许载入 */
  function demoSeed() {
    var seed = 20261015;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    var notes = ['咖啡', '地铁', '午饭', '超市', '晚饭', '打车', '买书', '奶茶', '买菜', '感冒药'];
    var out = [];
    for (var i = 41; i >= 0; i--) {
      var d = addDays(todayISO(), -i);
      var n = 1 + Math.floor(rnd() * 3);
      for (var k = 0; k < n; k++) {
        var amt = Math.round((6 + rnd() * 88) * 10) / 10;
        out.push({ id: uid(), type: 'out', amount: amt,
          cat: CATS.out[Math.floor(rnd() * CATS.out.length)], date: d,
          note: notes[Math.floor(rnd() * notes.length)] });
      }
      if (i % 30 === 12) out.push({ id: uid(), type: 'in', amount: 12500, cat: '工资', date: d, note: '工资到账' });
      if (i % 11 === 4) out.push({ id: uid(), type: 'in', amount: Math.round(40 + rnd() * 300), cat: '闲置', date: d, note: '闲置出掉' });
    }
    return out;
  }

  $('#a-demo').addEventListener('click', function () {
    if (state.entries.length) {
      ioNote('已经有 ' + state.entries.length + ' 笔数据了。示例数据混进真实账目里很难挑出来，想试就先「清空全部数据」。', true);
      return;
    }
    state.entries = demoSeed();
    save(); renderAll(); buildReceipt(); doPrint(false);
    ioNote('载入 ' + state.entries.length + ' 笔示例（覆盖过去 42 天）。这些是编的，不是你的账。');
  });

  /* 清空全部：两段确认 */
  var armWipe = null;
  $('#a-wipe').addEventListener('click', function () {
    var b = this;
    if (armWipe) {
      clearTimeout(armWipe); armWipe = null;
      state.entries = [];
      save(); stopEdit(); renderAll(); buildReceipt();
      b.textContent = '清空全部数据'; b.classList.remove('is-arm');
      ioNote('已清空。想找回就别关这个页面——不对，已经清了。下次先导出 JSON。', true);
      return;
    }
    b.textContent = '再点一次确认清空'; b.classList.add('is-arm');
    armWipe = setTimeout(function () {
      b.textContent = '清空全部数据'; b.classList.remove('is-arm'); armWipe = null;
    }, 4000);
  });

  /* 打印 */
  $('#p-btn').addEventListener('click', function () { doPrint(false); });

  /* ==========================================================
     启动
     ========================================================== */

  function renderAll() { renderList(); renderStats(); renderBudget(); }

  $('#s-budget').value = state.budget || '';
  $('#s-budgon').setAttribute('aria-checked', String(!!state.budgetOn));
  $('#s-sound').setAttribute('aria-checked', String(!!state.sound));
  $('#s-detail').setAttribute('aria-checked', String(!!state.detail));

  renderAll();
  buildReceipt();

  /* 首次进入：静音、快速出一次纸，让人知道这台机器是干什么的 */
  doPrint(true);

})();
</script>
</body>
</html>
